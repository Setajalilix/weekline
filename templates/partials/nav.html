{% load static %}
<div class="sidebar-stack">
  <a href="/" class="sidebar-brand">
    <img class="sidebar-mark" src="{% static 'favicon.ico' %}" alt="">
    <span class="sidebar-brand-copy">
      <span class="eyebrow">Personal week</span>
      <span class="sidebar-brand-name">Weekline</span>
    </span>
  </a>
  <nav class="flex flex-col gap-1">
    {% for name, label, href, icon in nav_items %}
      <a href="{{ href }}" class="nav-link {% if request.resolver_match.url_name == name %}is-active{% endif %}">
        <i data-lucide="{{ icon }}" class="h-4 w-4"></i>
        <span>{{ label }}</span>
      </a>
    {% endfor %}
  </nav>
  {% if active_timer %}
    <a href="/timer/" class="sidebar-session">
      <i data-lucide="clock-3" class="h-4 w-4"></i>
      <span>
        <span class="sidebar-session-kicker">Focus session</span>
        <span class="sidebar-session-title">{{ active_timer.activity_title }}</span>
      </span>
    </a>
  {% endif %}
  <form method="post" action="{% url 'logout' %}" class="mt-auto">
    {% csrf_token %}
    <button class="nav-link w-full" type="submit">
      <i data-lucide="log-out" class="h-4 w-4"></i>
      <span>Sign out</span>
    </button>
  </form>
</div>
