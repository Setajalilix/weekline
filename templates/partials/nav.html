<div class="flex h-full flex-col gap-6 p-5">
  <a href="/" class="block">
    <p class="text-[11px] uppercase tracking-[0.22em] text-mist">Personal week</p>
    <p class="mt-1 text-lg font-semibold tracking-tight">Weekline</p>
  </a>
  <nav class="flex flex-col gap-1">
    {% for name, label, href, icon in nav_items %}
      <a href="{{ href }}" class="nav-link {% if request.resolver_match.url_name == name %}is-active{% endif %}">
        <i data-lucide="{{ icon }}" class="h-4 w-4"></i>
        <span>{{ label }}</span>
      </a>
    {% endfor %}
  </nav>
  {% if active_timer %}
    <a href="/timer/" class="rounded-2xl border border-accent/30 bg-accent/10 px-4 py-3 text-sm">
      <p class="text-mist">Focus session</p>
      <p class="mt-1 font-medium">{{ active_timer.activity_title }}</p>
    </a>
  {% endif %}
  <form method="post" action="{% url 'logout' %}" class="mt-auto">
    {% csrf_token %}
    <button class="nav-link w-full text-left" type="submit">Sign out</button>
  </form>
</div>
