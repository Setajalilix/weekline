services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: weekline
      POSTGRES_USER: weekline
      POSTGRES_PASSWORD: weekline
    ports:
      - "5433:5432"
    volumes:
      - weekline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weekline -d weekline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  weekline_pgdata:
